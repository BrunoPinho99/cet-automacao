name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cet
          POSTGRES_PASSWORD: cet_secret
          POSTGRES_DB: cet_automacao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://cet:cet_secret@localhost:5432/cet_automacao_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Prisma Generate
        run: pnpm --filter @cet/db run generate

      - name: Prisma Migrate
        run: pnpm --filter @cet/db run db:migrate
        
      - name: Typecheck
        run: pnpm run typecheck
        
      - name: Lint
        run: pnpm run lint || true
        
      - name: Test
        run: pnpm run test
