version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cet_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cet_automacao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: cet_postgres_test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cet_secret}
      POSTGRES_DB: cet_automacao_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cet_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cet_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"    # Interface web

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: cet_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=cet_api_key_secreta_2026
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://cet:cet_secret@postgres:5432/cet_automacao?schema=public
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:redis_secret@redis:6379/0
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:redis_secret@redis:6379/1
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis # Nome do seu serviço redis no compose

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
